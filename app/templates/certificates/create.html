{% extends "base.html" %}

{% block title %}Issue Certificate — StratLearn{% endblock %}
{% block header_title %}Issue Official School Certificate{% endblock %}

{% block content %}
<div class="space-y-6 max-w-3xl mx-auto animate-fade-in">

    <!-- 1. HEADER -->
    <div class="relative overflow-hidden bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 rounded-2xl p-6 text-white shadow-xl border border-slate-800 flex items-center justify-between">
        <div>
            <span class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                📜 CERTIFICATE GENERATOR
            </span>
            <h1 class="text-2xl font-black tracking-tight mt-1">Issue Official Certificate</h1>
        </div>
        <a href="{{ url_for('certificates.index') }}" class="px-4 py-2 rounded-xl bg-white/10 text-white font-bold text-xs hover:bg-white/20">
            ← History
        </a>
    </div>

    <!-- 2. FORM SHEET -->
    <form method="POST" action="{{ url_for('certificates.create') }}" class="bg-white rounded-2xl border border-slate-200/80 p-6 sm:p-8 shadow-xs space-y-6">
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Select Student <span class="text-rose-500">*</span></label>
                <select name="student_id" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="">-- Choose Student --</option>
                    {% for st in students %}
                    <option value="{{ st.id }}" {% if request.args.get('student_id', type=int) == st.id %}selected{% endif %}>
                        {{ st.first_name }} {{ st.last_name }} (Adm: {{ st.admission_number or st.id }} | Class {{ st.school_class.name if st.school_class else '' }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Certificate Type <span class="text-rose-500">*</span></label>
                <select name="certificate_type" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    {% for ctype in cert_types %}
                    <option value="{{ ctype }}">{{ ctype }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Student Conduct / Character</label>
                    <select name="conduct" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="Excellent">Excellent</option>
                        <option value="Good" selected>Good</option>
                        <option value="Satisfactory">Satisfactory</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Reason for Issuance (Optional)</label>
                    <input type="text" name="reason" placeholder="e.g. Higher Education Admission / Relocation"
                           class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Official Remarks & Notes (Optional)</label>
                <textarea name="remarks" rows="3" placeholder="Additional remarks to be printed on certificate..."
                          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-end space-x-3">
            <a href="{{ url_for('certificates.index') }}" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow-md">
                🎓 Generate & Issue Certificate
            </button>
        </div>

    </form>

</div>
{% endblock %}

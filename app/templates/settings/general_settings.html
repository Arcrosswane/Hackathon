{% extends "settings/base_settings.html" %}

{% block settings_content %}
<form action="{{ url_for('settings.general_settings') }}" method="POST" class="space-y-8">
    
    <div>
        <h3 class="text-lg font-bold text-slate-900">General System Preferences</h3>
        <p class="text-xs text-slate-500">Configure global regional formats, currency, and timezones</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
            <label for="timezone" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                System Timezone
            </label>
            <select id="timezone" name="timezone" 
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
                <option value="Asia/Kolkata" {% if settings.get('timezone') == 'Asia/Kolkata' %}selected{% endif %}>Asia/Kolkata (IST +5:30)</option>
                <option value="UTC" {% if settings.get('timezone') == 'UTC' %}selected{% endif %}>UTC (Coordinated Universal Time)</option>
                <option value="America/New_York" {% if settings.get('timezone') == 'America/New_York' %}selected{% endif %}>America/New_York (EST/EDT)</option>
                <option value="Europe/London" {% if settings.get('timezone') == 'Europe/London' %}selected{% endif %}>Europe/London (GMT/BST)</option>
                <option value="Asia/Dubai" {% if settings.get('timezone') == 'Asia/Dubai' %}selected{% endif %}>Asia/Dubai (GST +4:00)</option>
                <option value="Asia/Singapore" {% if settings.get('timezone') == 'Asia/Singapore' %}selected{% endif %}>Asia/Singapore (SGT +8:00)</option>
            </select>
        </div>

        <div>
            <label for="country" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Default Country
            </label>
            <input type="text" id="country" name="country" value="{{ settings.get('country', 'India') }}"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
        </div>

        <div>
            <label for="currency" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Currency Symbol / Code
            </label>
            <input type="text" id="currency" name="currency" value="{{ settings.get('currency', 'INR (₹)') }}"
                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
        </div>

        <div>
            <label for="date_format" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Date Display Format
            </label>
            <select id="date_format" name="date_format" 
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
                <option value="YYYY-MM-DD" {% if settings.get('date_format') == 'YYYY-MM-DD' %}selected{% endif %}>YYYY-MM-DD (2026-08-13)</option>
                <option value="DD/MM/YYYY" {% if settings.get('date_format') == 'DD/MM/YYYY' %}selected{% endif %}>DD/MM/YYYY (13/08/2026)</option>
                <option value="MM/DD/YYYY" {% if settings.get('date_format') == 'MM/DD/YYYY' %}selected{% endif %}>MM/DD/YYYY (08/13/2026)</option>
                <option value="DD-MMM-YYYY" {% if settings.get('date_format') == 'DD-MMM-YYYY' %}selected{% endif %}>DD-MMM-YYYY (13-Aug-2026)</option>
            </select>
        </div>

        <div>
            <label for="time_format" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Time Display Format
            </label>
            <select id="time_format" name="time_format" 
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
                <option value="12-hour" {% if settings.get('time_format') == '12-hour' %}selected{% endif %}>12-hour (1:30 PM)</option>
                <option value="24-hour" {% if settings.get('time_format') == '24-hour' %}selected{% endif %}>24-hour (13:30)</option>
            </select>
        </div>
    </div>

    <div class="pt-4 flex justify-end">
        <button type="submit" 
                class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl shadow-sm transition-all">
            Save General Preferences
        </button>
    </div>

</form>
{% endblock %}

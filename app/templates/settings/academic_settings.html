{% extends "settings/base_settings.html" %}

{% block settings_content %}
<form action="{{ url_for('settings.academic_settings') }}" method="POST" class="space-y-8">
    
    <div>
        <h3 class="text-lg font-bold text-slate-900">Academic Policy & Rules</h3>
        <p class="text-xs text-slate-500">Configure global passing criteria and grading scale systems</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
            <label for="passing_percentage" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Minimum Passing Percentage (%) <span class="text-rose-500">*</span>
            </label>
            <div class="relative rounded-xl shadow-xs">
                <input type="number" id="passing_percentage" name="passing_percentage" min="0" max="100" step="0.5" 
                       value="{{ settings.get('passing_percentage', '33') }}" required
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
                <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400 font-bold text-xs">
                    %
                </div>
            </div>
            <p class="text-[11px] text-slate-400 mt-1">Students achieving marks below this threshold will be marked as Fail</p>
        </div>

        <div>
            <label for="grading_system" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                Primary Grading Scale System
            </label>
            <select id="grading_system" name="grading_system" 
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium text-slate-900 focus:ring-2 focus:ring-brand-600 focus:outline-none">
                <option value="Percentage" {% if settings.get('grading_system') == 'Percentage' %}selected{% endif %}>Percentage Marks (0% – 100%)</option>
                <option value="GPA 4.0 Scale" {% if settings.get('grading_system') == 'GPA 4.0 Scale' %}selected{% endif %}>GPA 4.0 Scale</option>
                <option value="GPA 5.0 Scale" {% if settings.get('grading_system') == 'GPA 5.0 Scale' %}selected{% endif %}>GPA 5.0 Scale</option>
                <option value="Letter Grades (A, B, C, D, F)" {% if settings.get('grading_system') == 'Letter Grades (A, B, C, D, F)' %}selected{% endif %}>Letter Grades (A, B, C, D, F)</option>
            </select>
        </div>
    </div>

    <div class="pt-4 flex justify-end">
        <button type="submit" 
                class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl shadow-sm transition-all">
            Save Academic Rules
        </button>
    </div>

</form>
{% endblock %}

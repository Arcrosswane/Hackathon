{% extends "base.html" %}

{% block title %}Finance & Payroll Settings — StratLearn Admin{% endblock %}
{% block header_title %}Fee Currency, Invoicing & Payroll Preferences{% endblock %}

{% block content %}
<div class="space-y-6 max-w-3xl mx-auto animate-fade-in">

    <!-- HERO HEADER -->
    <div class="relative overflow-hidden bg-gradient-to-r from-slate-950 via-slate-900 to-indigo-950 rounded-2xl p-6 text-white shadow-xl border border-slate-800 flex items-center justify-between">
        <div>
            <span class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                💰 FINANCE CONFIG
            </span>
            <h1 class="text-2xl font-black tracking-tight mt-1">Finance & Payroll Preferences</h1>
        </div>
    </div>

    <form method="POST" action="{{ url_for('settings.finance_settings') }}" class="bg-white p-8 rounded-3xl border border-slate-200/80 shadow-xl space-y-6 text-xs font-semibold">
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1">System Currency</label>
                <select name="currency" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="INR (₹)" {% if settings.get('currency') == 'INR (₹)' %}selected{% endif %}>INR (₹) — Indian Rupee</option>
                    <option value="USD ($)" {% if settings.get('currency') == 'USD ($)' %}selected{% endif %}>USD ($) — US Dollar</option>
                    <option value="EUR (€)" {% if settings.get('currency') == 'EUR (€)' %}selected{% endif %}>EUR (€) — Euro</option>
                    <option value="GBP (£)" {% if settings.get('currency') == 'GBP (£)' %}selected{% endif %}>GBP (£) — British Pound</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-1">Fee Invoice Number Prefix</label>
                <input type="text" name="fee_invoice_prefix" value="{{ settings.get('fee_invoice_prefix', 'INV-') }}" required
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-slate-700 font-bold mb-1">Default Fee Due Grace Period (Days)</label>
                <input type="number" name="fee_due_days" value="{{ settings.get('fee_due_days', '10') }}" required min="1" max="60"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-slate-700 font-bold mb-1">Payroll Cycle</label>
                <select name="payroll_cycle" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-slate-900 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="Monthly" {% if settings.get('payroll_cycle') == 'Monthly' %}selected{% endif %}>Monthly</option>
                    <option value="Bi-Weekly" {% if settings.get('payroll_cycle') == 'Bi-Weekly' %}selected{% endif %}>Bi-Weekly</option>
                </select>
            </div>
        </div>

        <div class="pt-4 border-t border-slate-100 flex items-center justify-end">
            <button type="submit" class="px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-black shadow-md">
                💾 Save Finance Preferences
            </button>
        </div>

    </form>

</div>
{% endblock %}

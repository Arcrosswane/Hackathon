{% extends "base.html" %}

{% block title %}Record Payment — StratLearn{% endblock %}
{% block header_title %}Record Payment{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

    <div class="flex items-center space-x-3">
        <a href="{{ url_for('fees.payments_list') }}" class="p-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </a>
        <div>
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Record Fee Payment</h2>
            <p class="text-xs font-medium text-slate-500">Record cash, UPI, card, or bank transfer payments and issue an official receipt.</p>
        </div>
    </div>

    <form action="{{ url_for('fees.record_payment_route') }}" method="POST" class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200/80 shadow-xs space-y-6">
        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Select Open Fee Invoice *</label>
            <select name="invoice_id" id="invoice-select" required onchange="updateInvoiceDetails()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                <option value="">-- Choose Invoice --</option>
                {% for inv in open_invoices %}
                <option value="{{ inv.id }}" 
                        data-balance="{{ inv.outstanding_balance }}"
                        data-student="{{ inv.student.first_name }} {{ inv.student.last_name or '' }}"
                        {% if target_invoice and target_invoice.id == inv.id %}selected{% endif %}>
                    #{{ inv.invoice_number }} — {{ inv.student.first_name }} {{ inv.student.last_name or '' }} (Outstanding: ₹{{ "%.2f"|format(inv.outstanding_balance) }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Payment Amount (₹) *</label>
                <input type="number" step="0.01" name="amount" id="payment-amount-input" required 
                       value="{{ target_invoice.outstanding_balance if target_invoice else '' }}"
                       placeholder="0.00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold focus:ring-2 focus:ring-brand-500 focus:outline-none">
                <span class="text-[10px] font-semibold text-rose-500 mt-1 block" id="balance-warning-text"></span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Payment Method *</label>
                <select name="payment_method" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-bold text-slate-800 focus:ring-2 focus:ring-brand-500 focus:outline-none">
                    {% for m in valid_methods %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Transaction Reference / Cheque / UPI ID</label>
                <input type="text" name="transaction_reference" placeholder="e.g. UPI/123456789 or CHQ-00421" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Payment Date *</label>
                <input type="date" name="payment_date" required value="{{ today_date }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Notes / Remarks</label>
            <input type="text" name="notes" placeholder="Optional notes for this payment..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-xs font-semibold focus:ring-2 focus:ring-brand-500 focus:outline-none">
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
            <a href="{{ url_for('fees.payments_list') }}" class="px-5 py-2.5 rounded-xl text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200">Cancel</a>
            <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md">Record Payment & Issue Receipt</button>
        </div>
    </form>

</div>

<script>
function updateInvoiceDetails() {
    const sel = document.getElementById('invoice-select');
    const opt = sel.options[sel.selectedIndex];
    const bal = opt ? opt.getAttribute('data-balance') : null;
    if (bal) {
        document.getElementById('payment-amount-input').value = parseFloat(bal).toFixed(2);
        document.getElementById('balance-warning-text').textContent = 'Max payable balance: ₹' + parseFloat(bal).toFixed(2);
    }
}
</script>
{% endblock %}
